# Keeps the pinned GitHub Actions (commit SHAs) and the npm dependencies current, one pull request per update.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # react and react-dom 19.3 grow the react-vendor chunk by 8.7 kB gzip, which breaks the 160 kB bundle budget
    # (npm run budget -- --enforce, in CI), so a pull request for them would fail by design. Revisit this when the
    # budget is reconsidered; 19.2 patches and 19.4 or later still arrive.
    ignore:
      - dependency-name: "react"
        versions: ["19.3.x"]
      - dependency-name: "react-dom"
        versions: ["19.3.x"]
