name: CI

# Pull requests and pushes to main and to the integration branches. A branch with an open pull request runs once,
# through pull_request, not twice. main runs it on every push because deploy.yml (the GitHub Pages copy) is manual
# only: EasyPanel builds main from the Dockerfile, so this is the only automatic gate on main.
on:
  push:
    branches: ["main", "redesign/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.58 cannot install Chromium on. Move this together
    # with a Playwright upgrade.
    runs-on: ubuntu-24.04
    # The end to end suite takes about 26 minutes and grows with every spec: at 30 a run is cancelled while all tests pass.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ESLint (every rule is an error) and the type check.
      - name: Lint and type check
        run: npm run lint

      - name: Security headers snippet is up to date
        run: npm run headers:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Fails above 160 kB gzip for the critical path (the target is 150; see scripts/check-bundle-budget.mjs).
      - name: Bundle budget
        run: npm run budget -- --enforce

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The specs mock the network and never reach the lead webhooks (e2e/n8nGuard.ts).
      - name: End to end tests
        run: npm run e2e

      - name: Keep the test results (screenshots, traces) when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  # What the config tests cannot prove, because they only read nginx.conf as text: that the image builds, that nginx
  # accepts the configuration, and that a running container answers with the headers and the cache rules promised.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build the image
        run: docker build -t vnone:ci .

      - name: nginx accepts the configuration
        run: docker run --rm vnone:ci nginx -t

      - name: Start the container
        run: docker run -d --name vnone -p 8080:80 vnone:ci

      - name: Wait for the container
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:8080/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs vnone
          exit 1

      - name: Smoke test of the headers, the cache and the redirects
        run: node scripts/smoke-container.mjs http://localhost:8080

      - name: Stop the container
        if: always()
        run: docker rm -f vnone

  # Proves the row level security of supabase/migrations in a throwaway Postgres 15 that lives only for this job: the
  # public key reads articles and nothing else, and the roles of the news job and of n8n can do one thing each. It uses
  # no secret and never reaches the real Supabase (scripts/run-rls-tests.mjs refuses an address that is not localhost),
  # so Dependabot and forks run it too. It runs in parallel with the others and only needs psql and Node, no npm ci.
  db-rls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # Pinned by digest (the multi-arch index of postgres:15 read on 2026-11-06, Postgres 15.19): a moved tag cannot change
        # what the proof runs on. Move it by hand when the major version moves, and keep the tag in this comment.
        image: postgres:15@sha256:1149d80408a63791782d07a0e2bd3b06a7adbcdc86e8dcc18d6ee01bacfe04ab
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Make sure psql is there
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)

      # The character checks of the tables must not depend on the locale: the same suite runs in the locale of the image
      # (en_US.utf8) and in a database made in the C locale. The runner prints the collation it ran in.
      - name: Row level security tests (en_US.utf8)
        run: npm run db:test
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/postgres

      - name: Create a database in the C locale
        run: psql -h localhost -U postgres -c "create database rls_c template template0 locale 'C' encoding 'UTF8'"
        env:
          PGPASSWORD: test

      - name: Row level security tests (C locale)
        run: npm run db:test
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/rls_c

  # Merges a Dependabot pull request by itself, so a patch or minor update never waits for a person. It runs only for
  # pull requests Dependabot opened, and only after verify, image and db-rls passed (a failed job above skips this one, and a
  # skipped merge leaves the pull request open). A major update is left open for a person to read. Nothing here is
  # checked out or built: the job runs no code of the pull request, it only reads the metadata Dependabot wrote and
  # calls the GitHub API. The only token is the default GITHUB_TOKEN, raised to write for this job alone.
  dependabot-merge:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    needs: [verify, image, db-rls]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the update type
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # An unknown update type (empty output) matches neither condition and is left open.
      - name: Merge a patch or minor update
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
        run: |
          set -euo pipefail
          # Dependabot flags a package whose maintainers changed. That is a reason for a person to look.
          if [ "$MAINTAINER_CHANGES" = "true" ]; then
            echo "::warning::The maintainers of a dependency changed. Left open for a person to review."
            exit 0
          fi
          # CI tested the pull request as it was. When main moved since, the merge would be a result nobody tested:
          # ask Dependabot to rebase (that runs CI again, and this job merges after it) instead of merging.
          behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_REF...$HEAD_SHA" --jq .behind_by)
          if [ "$behind" != "0" ]; then
            echo "::warning::main moved $behind commits ahead of this branch. Asking Dependabot to rebase."
            gh pr comment "$PR_URL" --body "@dependabot rebase"
            exit 0
          fi
          # --match-head-commit refuses the merge if the branch changed after the checks that just passed.
          gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"

      - name: Leave a major update for a person
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "::notice::A major update is never merged by itself. Read the release notes and merge it by hand."
