name: CI

# Pull requests and pushes to the integration branches. A branch with an open pull request runs once, through
# pull_request, not twice. main is covered by deploy.yml, which calls this workflow before it publishes, so a
# broken build or a failing test never reaches Pages.
on:
  push:
    branches: ["redesign/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.58 cannot install Chromium on. Move this together
    # with a Playwright upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ESLint (every rule is an error) and the type check.
      - name: Lint and type check
        run: npm run lint

      - name: Security headers snippet is up to date
        run: npm run headers:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Fails above 160 kB gzip for the critical path (the target is 150; see scripts/check-bundle-budget.mjs).
      - name: Bundle budget
        run: npm run budget -- --enforce

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The specs mock the network and never reach the lead webhooks (e2e/n8nGuard.ts).
      - name: End to end tests
        run: npm run e2e

      - name: Keep the test results (screenshots, traces) when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  # What the config tests cannot prove, because they only read nginx.conf as text: that the image builds, that nginx
  # accepts the configuration, and that a running container answers with the headers and the cache rules promised.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build the image
        run: docker build -t vnone:ci .

      - name: nginx accepts the configuration
        run: docker run --rm vnone:ci nginx -t

      - name: Start the container
        run: docker run -d --name vnone -p 8080:80 vnone:ci

      - name: Wait for the container
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:8080/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs vnone
          exit 1

      - name: Smoke test of the headers, the cache and the redirects
        run: node scripts/smoke-container.mjs http://localhost:8080

      - name: Stop the container
        if: always()
        run: docker rm -f vnone
