# The VN One site (a Vite single page app, with the head of each public route written at build time by scripts/build-seo.mjs)
# as served by the Docker image. The image copies this file to
# /etc/nginx/conf.d/default.conf and nginx/security-headers.conf to /etc/nginx/snippets/ (see the Dockerfile).
# src/test/nginx-config.test.ts reads this file, so the rules below are checked without an nginx binary.
#
# Two rules that are easy to break:
#  - nginx does not inherit add_header into a block that has its own add_header, so the security snippet is
#    included in the server block AND in every location. A new location without the include fails the test.
#  - one Cache-Control per response: no `expires` next to an add_header Cache-Control.
#  - the long Cache-Control lines have no `always`: nginx then adds them to 2xx and 3xx answers only, so a 404 for a
#    missing hashed file is never cached for a year. `no-cache` and the security headers keep `always`.
#
# Routes: every public route has its own file (servicos/index.html, ...), so try_files finds it; a path that is neither a file
# nor a route is a real 404 whose body is 404.html (the app, out of the index), not a 200 with the home page. A trailing slash is a
# 301 to the same path without it, so each page has one url (the canonical has none either).
#
# TLS ends at the proxy in front of this container, so Strict-Transport-Security is set there (see the notes in
# nginx/security-headers.conf). The www server answers by the Host header the proxy forwards and always sends the visitor to
# https on the apex, so it does not depend on the scheme this container sees.

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Redirects stay relative (the proxy owns the public host and port).
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # The page itself is never cached without revalidation: a deploy deletes the old hashed chunks, so an old
    # index.html would point to files that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /50x.html {
        include /etc/nginx/snippets/security-headers.conf;
    }

    # What an unknown route is answered with (see error_page in the last location). Only reached by that internal redirect.
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Two project pages were removed. The app also redirects them on the client; this answers it on the server.
    location ~ ^/projetos/(?:troco|importacao-massiva-nfe)/?$ {
        include /etc/nginx/snippets/security-headers.conf;
        return 301 /projetos;
    }

    # Dot files (.env, .git) are never served; .well-known is.
    location ~ /\.(?!well-known/) {
        include /etc/nginx/snippets/security-headers.conf;
        deny all;
    }

    # Vite names these files with a content hash, so a changed file is a new URL: a year, immutable.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Brand files, fonts, project screenshots and client logos keep their names when they change (no hash), so
    # they get a week and revalidate through ETag and Last-Modified instead of a year.
    location ~ ^/(?:brand|fonts|projects|clients)/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400, no-transform";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The CV is replaced by hand: an hour, then revalidate.
    location ~ ^/cv/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location ~ ^/(?:robots\.txt|sitemap\.xml)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Other files of public/ (og-banner.png, victor-photo.webp, favicons) and any image, font, video or pdf.
    location ~* \.(?:webp|avif|png|jpe?g|gif|ico|svg|woff2?|ttf|otf|eot|webmanifest|mp4|pdf)$ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400, no-transform";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # /servicos/ is /servicos: one url per page. After the file rules above, so a folder of files keeps its own rule.
    location ~ ^(/.+)/$ {
        include /etc/nginx/snippets/security-headers.conf;
        return 301 $1$is_args$args;
    }

    # The prerendered file of each route (try_files adds /index.html to the folder). Anything else is a 404 with the page of the
    # app as the body: the 404 stays a 404 for crawlers, and a visitor still sees the not found page.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/index.html =404;
        error_page 404 /404.html;
    }

    error_page 500 502 503 504 /50x.html;
}

# The www host is not served: it sends the visitor to the apex, over https, keeping the path and the query string.
server {
    listen 80;
    server_name www.vnone.com.br;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    return 301 https://vnone.com.br$request_uri;
}
